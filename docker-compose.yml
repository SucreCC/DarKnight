services:
  darknight:
    build:
      context: .
      dockerfile: Dockerfile
    image: darknight:latest
    container_name: darknight
    restart: unless-stopped
    environment:
      PROJECT_HOME: /app
      # 无 TLS 时默认只监听 127.0.0.1；Docker 端口映射需绑定 0.0.0.0
      UVICORN_HOST: 0.0.0.0
    ports:
      - "33100:33100"
      # Shadowsocks（方案 B：ss.darkight.com 灰云直连，需同步放行防火墙/安全组）
      - "1080:1080"
      - "1080:1080/udp"
    volumes:
      # 持久化：数据库、日志、Xray 运行时配置
      - ./data:/app/data
      # 如需覆盖配置，取消注释（需存在 docker/config.yaml）
      # - ./docker/config.yaml:/app/darknight/config.yaml:ro
    # 可选：Linux 生产环境若需 Xray 直接监听宿主机端口，可改用 host 网络
    # network_mode: host
