services:
  darknight:
    build:
      context: .
      dockerfile: Dockerfile
    image: darknight:latest
    container_name: darknight
    restart: unless-stopped
    environment:
      PROJECT_HOME: /app
      # 无 TLS 时默认只监听 127.0.0.1；Docker 端口映射需绑定 0.0.0.0
      UVICORN_HOST: 0.0.0.0
    ports:
      - "33100:33100"
      # TLS 代理（SNI 填 darkight.com；443 已由 mailcow nginx 占用）
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
      # Shadowsocks（灰云直连，需同步放行防火墙/安全组）
      - "1080:1080"
      - "1080:1080/udp"
    volumes:
      # 持久化：数据库、日志、Xray 运行时配置
      # 应用配置来自镜像内的 darknight/config.yaml（修改后需 docker compose up -d --build）
      - ./data:/app/data
      # Let's Encrypt（与 mailcow 共用；容器内路径见 xray_config.json）
      - /etc/letsencrypt:/etc/letsencrypt:ro
    # 可选：Linux 生产环境若需 Xray 直接监听宿主机端口，可改用 host 网络
    # network_mode: host
