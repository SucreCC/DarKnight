<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>验证码</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:8px;padding:32px;">
          <tr>
            <td style="font-size:20px;font-weight:600;color:#111;padding-bottom:16px;">邮箱验证码</td>
          </tr>
          <tr>
            <td style="font-size:15px;line-height:1.6;color:#333;padding-bottom:24px;">
              您的验证码是：
            </td>
          </tr>
          <tr>
            <td align="center" style="font-size:32px;letter-spacing:6px;font-weight:700;color:#111;padding-bottom:24px;">
              {{ code }}
            </td>
          </tr>
          <tr>
            <td style="font-size:14px;line-height:1.6;color:#666;">
              验证码 {{ expire_minutes }} 分钟内有效。如非本人操作，请忽略本邮件。
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
