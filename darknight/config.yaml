project:
  project_name: darknight
  description: "darknight"
  version: 1.0.0
  api_version: "/api/v1"

server:
  host: 0.0.0.0              # UVICORN_HOST
  port: 33100                # UVICORN_PORT
  uds: null                  # UVICORN_UDS
  ssl:
    certfile: null           # UVICORN_SSL_CERTFILE
    keyfile: null            # UVICORN_SSL_KEYFILE
    ca_type: public          # UVICORN_SSL_CA_TYPE: public | private
  doc_url: "/docs"
  redoc_url: "/redoc"
  docs: false
  allowed_origins:
    - "*"

web:
  dashboard_path: /
  debug: false
  # debug: true 时每次启动会 npm run build（需本机有 Node）。
  # Docker / 生产：镜像构建时已打好 dist/，启动直接使用，无需 npm。
  # DEBUG=true 且未显式设置时，会自动变为 http://127.0.0.1:{port}/api/v1/
  # vite_base_api: /api/v1/

logging:
  namespace: darknight       # logger 命名空间（darknight.xxx）
  filename: darknight        # 日志文件名（darknight.jsonl）
  level: INFO                # DEBUG, INFO, WARNING, ERROR
  save_to_file: true         # 写入 data/user/logs/darknight.jsonl
  console_output: true       # 输出到终端
  backup_count: 30           # 按天轮转，保留 30 天（历史文件为 darknight-2026-08-27.jsonl）
  routes:                    # 把吵闹的第三方 logger 分流到独立文件
    - filename: jobs         # 落到 data/user/logs/jobs.jsonl
      loggers: [apscheduler] # 含 apscheduler.scheduler / executors / jobstores
      level: INFO            # 分流文件收多细
      main_log_floor: WARNING  # 主日志和控制台只放行这个级别以上，job 异常仍可见

database:
  url: sqlite:///db.sqlite3  # SQLALCHEMY_DATABASE_URL
  pool_size: 10                # SQLALCHEMY_POOL_SIZE
  max_overflow: 30             # SQLALCHEMY_MAX_OVERFLOW

xray:
  json: ./xray_config.json
  fallbacks_inbound_tag: ""    # 兼容旧名 XRAY_FALLBACK_INBOUND_TAG
  executable_path: ./xray/xray.exe   # Linux 可用 ./xray/xray；不存在时回退到项目内 xray 目录
  assets_path: ./xray                # geoip.dat / geosite.dat 所在目录
  exclude_inbound_tags: []
  subscription_url_prefix: ""
  subscription_path: sub

telegram:
  api_token: ""
  admin_id: []                 # 逗号分隔的管理员 ID 列表
  proxy_url: ""
  logger_channel_id: 0
  default_vless_flow: ""

jwt:
  access_token_expire_minutes: 1440

templates:
  custom_directory: null
  subscription_page: subscription/index.html
  home_page: home/index.html
  clash:
    subscription: clash/default.yml
    settings: clash/settings.yml
  singbox:
    subscription: singbox/default.json
    settings: singbox/settings.json
  mux: mux/default.json
  v2ray:
    subscription: v2ray/default.json
    settings: v2ray/settings.json
  user_agent:
    default: user_agent/default.json
    grpc: user_agent/grpc.json

notifications:
  status_change: true
  user_created: true
  user_updated: true
  user_deleted: true
  user_data_used_reset: true
  user_sub_revoked: true
  if_data_usage_percent_reached: true
  if_days_left_reached: true
  login: true
  reached_usage_percent:
    - 80
  days_left:
    - 3
  recurrent:
    timeout: 180               # 每次重试间隔（秒）
    count: 3                   # 未收到成功响应时的重试次数

status_text:
  active: Active
  expired: Expired
  limited: Limited
  disabled: Disabled
  on_hold: On-Hold

users:
  autodelete_days: -1
  autodelete_include_limited_accounts: false

auth:
  sudo:
    username: "admin"
    password: "admin"

email:
  smtp_host: mail.darkight.com
  smtp_port: 587
  use_tls: true                 # STARTTLS
  dev_log_only: false
  default_account: noreply
  max_attempts: 3
  accounts:
    noreply:
      smtp_user: noreply@darkight.com
      smtp_password: "Dk.1136482445"           # 填入密码或应用密码
      from_address: noreply@darkight.com
      from_name: Darkight
    support:
      smtp_user: support@darkight.com
      smtp_password: "Dk.1136482445"           # 填入密码或应用密码
      from_address: support@darkight.com
      from_name: Darkight Support

webhook:
  addresses: []                # 逗号分隔的 webhook 地址列表
  secret: null

subscription:
  update_interval: "12"        # profile-update-interval（小时）
  support_url: https://t.me/
  profile_title: Subscription

discord:
  webhook_url: ""

paypal:
  enabled: true
  # 凭证优先读环境变量 PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET / PAYPAL_WEBHOOK_ID / PAYPAL_MODE。
  # 生产环境请把下面两项留空、改用环境变量，避免密钥进入版本库。
  client_id: "AbjKKz7XJ7ey-GYCXaKr008CTuJII_LNBdbLOYGrkwkmopnKeUX4EuwE9HF2yVHvtXN6IwB76mtecuAu"
  client_secret: "EEQOwB7jfHtI-bEoB8wlr9KXfAt0xpQzuR0jSpuAuCDed4YMN_5s5DewQLckI9Zz-dn6EpCH87dqWtbJ"
  mode: sandbox                # sandbox | live
  webhook_id: ""               # 留空时 Webhook 一律拒绝，防止伪造回调白拿套餐
  currency: USD
  order_timeout_minutes: 1440   # 未支付订单多久自动关闭（24 小时）；<=0 表示不自动关闭

# 优惠券：code 不区分大小写。percent_off 与 amount_off 可同时使用（先按比例再减固定额）。
# 折扣最多把金额降到 0.01，PayPal 无法扣款 0 元订单。
coupons:
  WELCOME20:
    percent_off: 20
    enabled: true
  # SAVE1:
  #   amount_off: 1.00
  #   expires_at: "2026-12-31"

jobs:
  core_health_check_interval: 10
  record_node_usages_interval: 30
  record_user_usages_interval: 10
  review_users_interval: 10
  send_notifications_interval: 30

features:
  disable_recording_node_usage: false
  external_config: ""
  login_notify_white_list: []
  use_custom_json_default: false
  use_custom_json_for_v2rayn: false
  use_custom_json_for_v2rayng: false
  use_custom_json_for_streisand: false
  use_custom_json_for_happ: false
